<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LangChain 旅游规划智能体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260608-step6">
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner-loader {
      animation: spin 1s linear infinite;
    }
    .media-upload-card:hover {
      background: rgba(255, 255, 255, 0.05) !important;
      border-color: #38bdf8 !important;
    }
    .media-upload-card.dragging {
      background: rgba(56, 189, 248, 0.1) !important;
      border-color: #38bdf8 !important;
      transform: scale(1.005);
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "vue": "https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.esm-browser.prod.js"
      }
    }
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <main class="app-shell" id="appShell" v-cloak>
    <!-- Sidebar Component -->
    <sidebar-component
      v-model:active-mode="activeMode"
      v-model:active-tab="activeTab"
      :sidebar-collapsed="sidebarCollapsed"
      :conversations="conversations"
      :active-conversation-id="activeConversationId"
      :skills="skills"
      :devices="devices"
      :system-status="systemStatus"
      :location-status-text="locationStatusText"
      :yolo-inference-status="yoloInferenceStatus"
      v-model:force-cloud="forceCloud"
      @toggle-sidebar="sidebarCollapsed = !sidebarCollapsed"
      @new-chat="newChat"
      @select-conversation="selectConversation"
      @delete-conversation="deleteConversation"
      @manual-heartbeat="manualHeartbeat"
      @use-skill="useSkill"
      @control-device="executeBoardControl"
    ></sidebar-component>

    <!-- Travel Assistant Panel -->
    <travel-assistant
      v-if="activeMode === 'travel'"
      :messages="messages"
      v-model:thinking-mode="thinkingMode"
      v-model:offline-mode="offlineMode"
      v-model:input-suggest="inputSuggest"
      v-model:chat-input="chatInput"
      :is-generating="isGenerating"
      :input-tips="inputTips"
      :show-input-tips="showInputTips"
      :input-tips-dismissed="inputTipsDismissed"
      :sidebar-collapsed="sidebarCollapsed"
      :generation-status="generationStatus"
      :generation-trace="generationTrace"
      :generation-stats="generationStats"
      @send-message="sendMessage"
      @clear-messages="clearMessages"
      @locate="requestBrowserLocation"
      @toggle-sidebar="sidebarCollapsed = !sidebarCollapsed"
      @select-tip="selectTip"
      @dismiss-input-tips="dismissInputTips"
      @restore-input-tips="restoreInputTips"
    ></travel-assistant>

    <!-- Edge Monitor Panel (takes full width of the remaining viewport) -->
    <edge-monitor
      v-else
      :tasks="tasks"
      :yolo-inference-status="yoloInferenceStatus"
      :sidebar-collapsed="sidebarCollapsed"
      :is-terminal-open="isTerminalOpen"
      :terminal-logs="terminalLogs"
      :terminal-loading="terminalLoading"
      :ssh-status="sshStatus"
      :ssh-status-text="sshStatusText"
      @open-task="openTaskModal"
      @run-analysis="runAnalysis"
      @toggle-sidebar="sidebarCollapsed = !sidebarCollapsed"
      @toggle-terminal="isTerminalOpen = !isTerminalOpen"
      @retry-ssh="retrySSHConnection"
      @log="(text) => terminalLogs += text"
      @upload-success="loadEdgeStatus"
      @run-uploaded-yolo="runUploadedYolo"
      @camera-yolo-started="yoloInferenceStatus = 'running_board'"
      @camera-yolo-stopped="yoloInferenceStatus = 'idle'"
    ></edge-monitor>
    
    <!-- Task Detail Modal -->
    <task-modal
      :is-open="isModalOpen"
      :task-id="activeTaskId"
      :task-detail="activeTaskDetail"
      :loading="modalLoading"
      :error="modalError"
      @close="closeTaskModal"
      @run-analysis="runAnalysis"
    ></task-modal>

    <!-- Board Console Log Modal -->
    <div class="modal-overlay" v-if="isBoardConsoleOpen" style="z-index: 2000;">
      <div class="modal-dialog" style="max-width: 700px;">
        <header class="modal-header">
          <h3 v-text="boardConsoleTitle"></h3>
          <button type="button" class="modal-close-btn" @click="isBoardConsoleOpen = false">&times;</button>
        </header>
        <div class="modal-body" style="padding: 0;">
          <div style="background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 12px; padding: 16px; border-radius: 8px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; min-height: 200px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);">
            <span v-text="boardConsoleLog"></span>
            <span v-if="boardConsoleLoading" style="display:inline-block; animation: blink 1s infinite; font-weight: bold;">_</span>
          </div>
        </div>
        <footer class="modal-footer" style="justify-content: flex-end;">
          <button type="button" class="dashboard-refresh-btn" @click="isBoardConsoleOpen = false" style="margin: 0; padding: 6px 16px; background: var(--accent); color: white; border-color: var(--accent);">关闭</button>
        </footer>
      </div>
    </div>

    <!-- Run YOLO Board File Selection Modal -->
    <div class="modal-overlay" v-if="isRunYoloModalOpen" style="z-index: 2000; display: flex; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);">
      <div class="modal-dialog" style="max-width: 550px; width: 90%; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); overflow: hidden; display: flex; flex-direction: column; max-height: 90vh;">
        <header class="modal-header" style="padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;">
          <h3 style="margin: 0; font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px;">
            <span>🔍 选择板端文件运行 YOLO 推理</span>
          </h3>
          <button type="button" class="modal-close-btn" @click="isRunYoloModalOpen = false" style="background: none; border: none; font-size: 20px; color: var(--muted); cursor: pointer;">&times;</button>
        </header>
        <div class="modal-body" style="padding: 20px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; max-height: 60vh;">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 12px; font-weight: 600; color: var(--muted);">从已扫描板端文件列表中选择：</label>
            <div class="custom-file-list" style="max-height: 180px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: rgba(0,0,0,0.02); padding: 6px; display: flex; flex-direction: column; gap: 4px;">
              <div v-if="!boardFiles || !boardFiles.length" style="padding: 12px; text-align: center; color: var(--muted); font-size: 13px;">
                暂无扫描到的多媒体文件
              </div>
              <div v-else 
                   v-for="file in boardFiles" 
                   :key="file" 
                   @click="selectedBoardFile = (selectedBoardFile === file ? '' : file)"
                   :style="{
                     padding: '8px 12px',
                     borderRadius: '6px',
                     fontSize: '13px',
                     cursor: 'pointer',
                     whiteSpace: 'nowrap',
                     overflow: 'hidden',
                     textOverflow: 'ellipsis',
                     flexShrink: 0,
                     background: selectedBoardFile === file ? 'var(--accent)' : 'transparent',
                     color: selectedBoardFile === file ? '#ffffff' : 'var(--text)',
                     border: selectedBoardFile === file ? '1px solid var(--accent)' : '1px solid transparent',
                     transition: 'all 0.15s ease'
                   }"
                   class="board-file-item"
                   :title="file">
                {% raw %}📁 {{ file.split('/').pop() }}
                <span style="font-size: 11px; opacity: 0.6; margin-left: 8px;">({{ file }})</span>{% endraw %}
              </div>
            </div>
          </div>
          
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <label style="font-size: 12px; font-weight: 600; color: var(--muted);">或手动输入自定义绝对路径：</label>
            <input type="text" 
                   v-model="customBoardFile" 
                   placeholder="例如: /home/HwHiAiUser/samples/notebooks/01-yolov5/world_cup.jpg" 
                   style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-solid); color: var(--text); font-size: 13px; outline: none;" />
          </div>
          
          <div style="font-size: 11px; color: var(--muted); line-height: 1.4;">
            * 提示: 视频文件将自动执行板端 6 帧等距抽帧后进行 YOLO 融合时序多模态评估；图片文件则直接进行推理。
          </div>
        </div>
        <footer class="modal-footer" style="padding: 12px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" 
                  @click="isRunYoloModalOpen = false" 
                  style="padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--text); font-weight: 600; font-size: 12px; cursor: pointer;">
            取消
          </button>
          <button type="button" 
                  @click="submitBoardYolo" 
                  :disabled="runYoloLoading || (!selectedBoardFile && !customBoardFile.trim())" 
                  style="padding: 8px 20px; border-radius: 6px; border: none; background: var(--accent); color: white; font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
            <span v-if="runYoloLoading" class="spinner-loader" style="width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.2); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite;"></span>
            运行推理
          </button>
        </footer>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="{{ url_for('static', filename='travel_helpers.js') }}?v=20260608-step6"></script>
  <script src="{{ url_for('static', filename='map_helpers.js') }}?v=20260608-step6"></script>
  <script src="{{ url_for('static', filename='chat_helpers.js') }}?v=20260608-step6"></script>
  <script src="{{ url_for('static', filename='cards_helpers.js') }}?v=20260608-step6"></script>
  <script type="module" src="{{ url_for('static', filename='app.js') }}?v=20260608-step6"></script>
</body>
</html>

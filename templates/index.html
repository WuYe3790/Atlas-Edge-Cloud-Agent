<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LangChain 旅游规划智能体</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=20260605-terminal-drawer-fix">
  <script type="importmap">
    {
      "imports": {
        "vue": "https://cdn.jsdelivr.net/npm/vue@3.3.4/dist/vue.esm-browser.prod.js"
      }
    }
  </script>
</head>
<body>
  <div class="bg-grid"></div>
  <main class="app-shell" id="appShell" v-cloak>
    <!-- Sidebar Component -->
    <sidebar-component
      v-model:active-mode="activeMode"
      v-model:active-tab="activeTab"
      :sidebar-collapsed="sidebarCollapsed"
      :conversations="conversations"
      :active-conversation-id="activeConversationId"
      :skills="skills"
      :devices="devices"
      :system-status="systemStatus"
      :location-status-text="locationStatusText"
      @toggle-sidebar="sidebarCollapsed = !sidebarCollapsed"
      @new-chat="newChat"
      @select-conversation="selectConversation"
      @delete-conversation="deleteConversation"
      @manual-heartbeat="manualHeartbeat"
      @use-skill="useSkill"
      @control-device="executeBoardControl"
    ></sidebar-component>

    <!-- Travel Assistant Panel -->
    <travel-assistant
      v-if="activeMode === 'travel'"
      :messages="messages"
      v-model:thinking-mode="thinkingMode"
      v-model:offline-mode="offlineMode"
      v-model:input-suggest="inputSuggest"
      v-model:chat-input="chatInput"
      :is-generating="isGenerating"
      :input-tips="inputTips"
      :show-input-tips="showInputTips"
      :sidebar-collapsed="sidebarCollapsed"
      :generation-status="generationStatus"
      :generation-trace="generationTrace"
      :generation-stats="generationStats"
      @send-message="sendMessage"
      @clear-messages="clearMessages"
      @locate="requestBrowserLocation"
      @toggle-sidebar="sidebarCollapsed = !sidebarCollapsed"
      @select-tip="selectTip"
    ></travel-assistant>

    <!-- Edge Monitor Panel (takes full width of the remaining viewport) -->
    <edge-monitor
      v-else
      :tasks="tasks"
      :sidebar-collapsed="sidebarCollapsed"
      :is-terminal-open="isTerminalOpen"
      :terminal-logs="terminalLogs"
      :terminal-loading="terminalLoading"
      :ssh-status="sshStatus"
      :ssh-status-text="sshStatusText"
      @open-task="openTaskModal"
      @run-analysis="runAnalysis"
      @toggle-sidebar="sidebarCollapsed = !sidebarCollapsed"
      @toggle-terminal="isTerminalOpen = !isTerminalOpen"
      @retry-ssh="retrySSHConnection"
    ></edge-monitor>
    
    <!-- Task Detail Modal -->
    <task-modal
      :is-open="isModalOpen"
      :task-id="activeTaskId"
      :task-detail="activeTaskDetail"
      :loading="modalLoading"
      :error="modalError"
      @close="closeTaskModal"
      @run-analysis="runAnalysis"
    ></task-modal>

    <!-- Board Console Log Modal -->
    <div class="modal-overlay" v-if="isBoardConsoleOpen" style="z-index: 2000;">
      <div class="modal-dialog" style="max-width: 700px;">
        <header class="modal-header">
          <h3 v-text="boardConsoleTitle"></h3>
          <button type="button" class="modal-close-btn" @click="isBoardConsoleOpen = false">&times;</button>
        </header>
        <div class="modal-body" style="padding: 0;">
          <div style="background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 12px; padding: 16px; border-radius: 8px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; min-height: 200px; box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);">
            <span v-text="boardConsoleLog"></span>
            <span v-if="boardConsoleLoading" style="display:inline-block; animation: blink 1s infinite; font-weight: bold;">_</span>
          </div>
        </div>
        <footer class="modal-footer" style="justify-content: flex-end;">
          <button type="button" class="dashboard-refresh-btn" @click="isBoardConsoleOpen = false" style="margin: 0; padding: 6px 16px; background: var(--accent); color: white; border-color: var(--accent);">关闭</button>
        </footer>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="{{ url_for('static', filename='travel_helpers.js') }}?v=20260605-terminal-drawer-fix"></script>
  <script type="module" src="{{ url_for('static', filename='app.js') }}?v=20260605-terminal-drawer-fix"></script>
</body>
</html>
